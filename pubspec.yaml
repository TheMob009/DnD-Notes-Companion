name: dnd_notes_companion
description: "Aplicación Flutter para tomar y organizar notas de campañas TTRPG (DnD)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI y estilo
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.1
  provider: ^6.1.2

  url_launcher: ^6.3.0

  # Persistencia local
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  shared_preferences: ^2.3.2

  # Multimedia e interacción con el SO
  image_picker: ^1.1.2
  share_plus: ^10.0.2

  # Compartir nota
  pdf: ^3.10.8
  printing: ^5.12.0


  # Utilidades
  logger: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Splash nativo
  flutter_native_splash: ^2.3.10

flutter_native_splash:
  color: "#1E0F3A"            # Color de fondo (morado oscuro)
  color_dark: "#0B0717"
  image: assets/logo_dark.png # Logo central
  android: true
  ios: true
  web: true

flutter:
  uses-material-design: true

  assets:
    - assets/logo_dark.png
    - assets/questions.json
